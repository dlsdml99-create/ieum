<title>이음</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1E2125">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen wayfinding board. Graphite sign band (tools + languages) on top, the conversation in the middle, three yellow signs (ear · mouth · eye) as the dock. Full-screen boards for showing things to the other person. */
:root{
  --bg:#EDEDE7;
  --surface:#FFFFFF;
  --ink:#16181B;
  --muted:#5B605D;
  --line:#D2D3CB;
  --sign:#FFCC00;
  --on-sign:#16181B;
  --sign-muted:#5C4B00;
  --sign-hover:rgba(22,24,27,.09);
  --board:#1E2125;
  --on-board:#F2F2EC;
  --board-muted:#A6AAAE;
  --board-line:rgba(255,255,255,.13);
  --board-hover:rgba(255,255,255,.08);
  --blue:#1C5DAE;
  --rec:#D63A1E;
  --on-rec:#FFFFFF;
  --rec-line:rgba(255,255,255,.55);
  --rec-shade:rgba(0,0,0,.2);
  --sos-ink:#FF6A4D;
  --lens:#0C0D0F;
  --on-lens:#F2F2EC;
  --scrim:rgba(10,12,14,.5);
  --shadow:0 8px 28px rgba(0,0,0,.22);
  --tag-shadow:0 1px 4px rgba(0,0,0,.4);
  --f-sign:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101214;--surface:#1A1D20;--ink:#ECEDE7;--muted:#9EA3A0;--line:#2C3034;
    --board:#24282D;--board-line:rgba(255,255,255,.1);
    --blue:#7DAEEE;--rec:#E2472B;--scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101214;--surface:#1A1D20;--ink:#ECEDE7;--muted:#9EA3A0;--line:#2C3034;
  --board:#24282D;--board-line:rgba(255,255,255,.1);
  --blue:#7DAEEE;--rec:#E2472B;--scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--board);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
p{margin:0}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.app{height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grow{flex:1}

/* sign band */
.top{flex:none;background:var(--board);color:var(--on-board)}
.top .wrap{padding-block:4px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.brand{display:flex;align-items:center;gap:8px;min-height:46px}
.mark{width:28px;height:28px;border-radius:4px;background:var(--sign);color:var(--on-sign);display:grid;place-items:center;flex:none}
.mark .i{width:18px;height:18px;stroke-width:2.6}
.mark.sm{width:20px;height:20px;border-radius:3px}
.mark.sm .i{width:13px;height:13px}
.brand h1{margin:0;font-size:20px;line-height:1;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.tools{display:flex;gap:2px;flex:none}
.tool{width:44px;height:46px;display:grid;justify-items:center;align-content:center;gap:3px;border-radius:var(--r);color:var(--on-board)}
.tool .i{width:20px;height:20px}
.tool span{font-size:10px;line-height:1;color:var(--board-muted);white-space:nowrap;letter-spacing:-.02em}
.tool.sos b{font-family:var(--f-sign);font-weight:700;font-size:16px;line-height:20px;letter-spacing:.04em;color:var(--sos-ink)}
.langs{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);align-items:center;gap:6px}
.plate{display:flex;align-items:center;gap:8px;min-width:0;height:46px;padding:0 10px;border-radius:var(--r);border:1px solid var(--board-line);text-align:left}
.who{font-size:12px;color:var(--board-muted);flex:none}
.code{font-family:var(--f-sign);font-weight:700;font-size:24px;line-height:1;color:var(--sign);letter-spacing:.02em;flex:none}
.nm{font-weight:500;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate .chev{width:16px;height:16px;color:var(--board-muted)}
.arrows{width:36px;height:46px;border-radius:var(--r);color:var(--sign);display:grid;place-items:center}
.arrows .i{width:22px;height:22px;transition:transform .3s ease}
.arrows.spin .i{transform:rotate(180deg)}
@media (hover:hover){.arrows:hover{background:var(--board-hover)}}

/* conversation */
.feed{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.feed-in{padding-block:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
#feedNote:empty{display:none}
.list{display:flex;flex-direction:column;gap:10px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r);font-size:13px;color:var(--muted)}
.note .i{width:18px;height:18px;margin-top:1px}
.note p{flex:1;min-width:0}
.note button{flex:none;font-size:13px;font-weight:700;color:var(--ink);padding:2px 4px}
.card{border-radius:var(--r);padding:11px 14px 8px;display:grid;gap:3px;min-width:0}
.card.speak{background:var(--sign);color:var(--on-sign);margin-left:10%}
.card.listen{background:var(--board);color:var(--on-board);border:1px solid var(--board-line);margin-right:10%}
.card.see{background:var(--surface);border:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:8px;min-height:24px;font-size:12px;font-weight:700}
.card-h .i{width:16px;height:16px}
.route{font-family:var(--f-sign);font-weight:600;font-size:13px;letter-spacing:.06em}
.ex{margin-left:auto;font-size:11px;font-weight:500;padding:0 6px;border:1px solid currentColor;border-radius:3px;opacity:.65}
.cur-chip{margin-left:auto;display:inline-flex;align-items:center;gap:2px;height:24px;padding:0 4px 0 7px;border-radius:3px;background:var(--board);color:var(--sign);font-family:var(--f-sign);font-weight:700;font-size:13px;letter-spacing:.04em}
.cur-chip .i{width:14px;height:14px}
.cur-chip ~ .ex{margin-left:0}
.orig{font-size:14px;overflow-wrap:anywhere}
.card.speak .orig{color:var(--sign-muted)}
.card.listen .orig{color:var(--board-muted)}
.trans{font-size:19px;line-height:1.38;font-weight:700;overflow-wrap:anywhere}
.trans.long{font-size:17px}
.err{font-size:14px;font-weight:500;padding-block:2px}
.acts{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0 0 -8px}
.act-b{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 8px;border-radius:4px;font-size:13px;font-weight:500}
.act-b .i{width:18px;height:18px}
.act-b em{font-style:normal;font-family:var(--f-sign);font-weight:700;background:var(--sign);color:var(--on-sign);border-radius:3px;padding:0 5px;line-height:18px}
.kick{font-size:11px;font-weight:700;color:var(--board-muted);margin-top:6px}
.replies{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.rchip{height:32px;padding:0 11px;border-radius:4px;border:1px solid var(--board-line);color:var(--on-board);font-size:13px;font-weight:500}
.speaking .w1{animation:wave 1s infinite}
.speaking .w2{animation:wave 1s .25s infinite}
@keyframes wave{0%,100%{opacity:.2}50%{opacity:1}}
.dots{display:inline-flex;gap:5px;align-items:center;height:26px}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.25;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}40%{opacity:1}}
.wait{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.see-pic{display:block;width:100%;padding:0;margin:4px 0 2px;border-radius:4px;overflow:hidden;position:relative}
.see-img{display:block;width:100%;max-width:100%;height:150px;object-fit:cover;background:var(--bg)}
.see-img.ph{animation:blink 1.6s infinite;border-radius:4px;margin:4px 0 2px}
.see-pic .over{position:absolute;right:6px;bottom:6px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:3px;background:var(--board);color:var(--sign);font-size:12px;font-weight:700}
.see-pic .over .i{width:14px;height:14px}
.lines{list-style:none;margin:2px 0 0;padding:0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.line .o,.line .t,.line .pr{grid-column:1;overflow-wrap:anywhere}
.line .o{font-size:13px;color:var(--muted)}
.line .t{font-size:16px;font-weight:700}
.line .pr{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-family:var(--f-sign);font-size:14px;font-weight:600;color:var(--muted)}
.line .pr b{color:var(--ink);font-weight:700}
.line .say{grid-column:2;grid-row:1/span 3;width:40px;height:40px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}

/* dock */
.dock{flex:none;background:var(--bg);border-top:1px solid var(--line)}
.dock .wrap{padding-block:8px 4px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.phrases{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.phrases::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.compose{display:flex;gap:6px;margin:0}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:44px;padding:0 4px 0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field:focus-within{border-color:var(--ink)}
.field input{flex:1;width:0;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px}
.field input::placeholder{color:var(--muted)}
.mode-chip{flex:none;display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 2px 0 8px;border-radius:3px;font-size:12px;font-weight:700;white-space:nowrap}
.mode-chip.speak{background:var(--sign);color:var(--on-sign)}
.mode-chip.listen{background:var(--board);color:var(--on-board)}
.mode-chip button{width:24px;height:24px;display:grid;place-items:center}
.mode-chip .i{width:14px;height:14px}
.send{flex:none;width:44px;height:44px;border-radius:var(--r);background:var(--board);color:var(--sign);display:grid;place-items:center}
.send:disabled{opacity:.35}
.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sign{position:relative;min-height:76px;padding:8px 4px 9px;border-radius:8px;background:var(--sign);color:var(--on-sign);display:grid;justify-items:center;align-content:center;gap:3px;transition:transform .12s ease}
.sign:active{transform:scale(.97)}
.sign .i{width:28px;height:28px;stroke-width:2.2}
.sign b{font-size:16px;line-height:1.2}
.sign small{font-family:var(--f-sign);font-weight:600;font-size:12px;line-height:1;letter-spacing:.06em}
.sign.rec{background:var(--rec);color:var(--on-rec)}
.sign.rec::after{content:"";position:absolute;inset:-4px;border:2px solid var(--rec);border-radius:11px;animation:ring 1.3s ease-out infinite;pointer-events:none}
@keyframes ring{from{opacity:.9;transform:scale(.98)}to{opacity:0;transform:scale(1.06)}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:18px;font-size:11px;color:var(--muted)}
.ver{font-family:var(--f-sign);font-weight:600;font-size:12px;letter-spacing:.05em}

/* face to face */
.face{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;background:var(--board)}
.half{flex:1;min-height:0;display:flex}
.half.them{background:var(--sign);color:var(--on-sign);transform:rotate(180deg);padding-bottom:env(safe-area-inset-top,0px)}
.half.me{background:var(--board);color:var(--on-board);padding-bottom:env(safe-area-inset-bottom,0px)}
.half-in{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.fh-lang{font-family:var(--f-sign);font-weight:700;font-size:13px;letter-spacing:.06em;opacity:.7}
.fh-text{flex:1;font-size:clamp(20px,6vw,30px);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.fh-sub{font-size:14px;opacity:.72;overflow-wrap:anywhere}
.fh-sub:empty{display:none}
.fh-replies{display:flex;flex-wrap:wrap;gap:6px}
.fh-form{display:flex;gap:6px;margin:0;border-radius:var(--r)}
.fh-form input{flex:1;width:0;min-width:0;height:46px;border-radius:var(--r);border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:16px;padding:0 12px;outline:0}
.fh-form input::placeholder{color:inherit;opacity:.6}
.fh-form button{flex:none;width:46px;height:46px;border-radius:var(--r);display:grid;place-items:center}
.half.them .fh-form button{background:var(--on-sign);color:var(--sign)}
.half.me .fh-form button{background:var(--sign);color:var(--on-sign)}
.fh-form.turn{animation:turn .9s ease 2}
@keyframes turn{50%{box-shadow:0 0 0 6px var(--on-sign)}}
.fh-mic{flex:none;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px}
.fh-mic .i{width:22px;height:22px}
.half.them .fh-mic{background:var(--on-sign);color:var(--sign)}
.half.me .fh-mic{background:var(--sign);color:var(--on-sign)}
.half .fh-mic.rec{background:var(--rec);color:var(--on-rec)}
.face-mid{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:8px;padding:4px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));background:var(--board);color:var(--on-board);border-block:1px solid var(--board-line)}
.fm-route{font-family:var(--f-sign);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--sign)}
.fm-b{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:var(--r);font-weight:700;font-size:14px}

/* photo lens */
.lens{position:fixed;inset:0;z-index:52;display:flex;flex-direction:column;gap:8px;background:var(--lens);color:var(--on-lens);padding:calc(env(safe-area-inset-top,0px) + 6px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.lens-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lens-t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.lens-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.lens-pic{position:relative;max-width:100%}
.lens-pic img{display:block;width:100%;height:100%;object-fit:contain;border-radius:4px}
.lens-tags{position:absolute;inset:0}
.lens-tag{position:absolute;padding:1px 4px;border-radius:3px;background:var(--sign);color:var(--on-sign);font-weight:700;line-height:1.15;text-align:left;box-shadow:var(--tag-shadow);overflow-wrap:anywhere}
.lens-tag small{font-family:var(--f-sign);font-weight:600;font-size:.85em;white-space:nowrap}
.lens-foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lens-b{display:inline-flex;align-items:center;gap:6px;height:46px;padding:0 16px;border-radius:23px;border:1.5px solid var(--board-line);font-weight:700}
.lens-b.main{background:var(--sign);color:var(--on-sign);border-color:var(--sign)}
.lens-note{font-size:12px;color:var(--board-muted);text-align:center}

/* show to the other person */
.big{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;gap:12px;background:var(--sign);color:var(--on-sign);padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.big.sos{background:var(--rec);color:var(--on-rec)}
.big-bar{display:flex;justify-content:space-between}
.big-b{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:var(--r);font-weight:700}
.big-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;transition:transform .35s ease}
.big-body>:first-child{margin-top:auto}
.big-body>:last-child{margin-bottom:auto}
.big-body.flip{transform:rotate(180deg)}
.big-kicker{font-size:14px;font-weight:700;opacity:.7}
.big-lead{font-size:24px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.big-trans{font-weight:700;line-height:1.22;overflow-wrap:anywhere;text-wrap:balance}
.big-addr{font-size:26px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.big-orig{font-size:17px;color:var(--sign-muted);overflow-wrap:anywhere}
.big.sos .big-orig{color:var(--on-rec);opacity:.85}
.big-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.big-list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:6px;border-top:2px solid currentColor;font-size:26px;font-weight:700;line-height:1.25}
.big-list li span:first-child{min-width:0;overflow-wrap:anywhere}
.big-list li span:last-child{flex:none;font-family:var(--f-sign)}
.big-foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.big-say{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 22px;border-radius:26px;background:var(--on-sign);color:var(--sign);font-weight:700;font-size:16px}
.big-say.alt{background:transparent;color:inherit;border:2px solid currentColor}
.big.sos .big-say{background:var(--on-rec);color:var(--rec)}
.big.sos .big-say.alt{background:transparent;color:inherit}
.sos-lines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sos-b{min-height:44px;padding:6px 10px;border-radius:var(--r);border:1.5px solid var(--rec-line);font-weight:700;font-size:14px;text-align:left}
.sos-b.on{background:var(--on-rec);color:var(--rec);border-color:var(--on-rec)}
.sos-nums{display:grid;gap:2px;border-top:2px solid var(--rec-line);padding-top:8px}
.sos-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.sos-country{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 6px 0 10px;border-radius:4px;background:var(--rec-shade);font-weight:700}
.sos-country .i{width:16px;height:16px}
.sos-num{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0;text-align:left;width:100%}
.sos-num span{font-size:14px}
.sos-num b{font-family:var(--f-sign);font-size:30px;line-height:1.1;letter-spacing:.03em;white-space:nowrap}
.sos-num.consul{flex-direction:column;align-items:flex-start;gap:0;padding-top:8px}
.sos-num.consul b{font-size:24px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:82%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:12px 12px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 4px}
.sheet-h h2{margin:0;font-size:17px}
.sheet-body{overflow-y:auto;padding-block:0 14px}
.sheet-note{font-size:13px;color:var(--muted);padding-bottom:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 2px;border-top:1px solid var(--line);text-align:left}
.opt:first-child{border-top:0}
.opt>.i{width:22px;height:22px}

.o-main b{font-size:16px;overflow-wrap:anywhere}
.o-main small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.step{flex:none;display:flex;align-items:center;gap:2px}
.step button{width:38px;height:38px;border-radius:4px;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1}

  /* ---------- feed ---------- */

  function lastListen() {

  function seeNode(it, ex) {

      ex ? h('span', { class: 'ex' }, '예시') : it.sample ? h('span', { class: 'ex' }, '예시 사진') : null));

  function renderFeed() {

  const findNode = (it) => feedList.querySelector('[data-id="' + it.id + '"]');
  function addItem(it) {

    else if (micBlocked && !S.noteSeen) node = noteBox('mic', '미리보기에선 마이크를 쓸 수 없어서 듣기·말하기를 누르면 글로 받아요. 키보드의 마이크 버튼으로 말해도 돼요. 앱(APK)에선 바로 들어요.',

  /* ---------- text translation ---------- */
  function finish(it, trans, opts) {
    it.trans = trans; it.status = 'done'; delete it.auto;
    updateItem(it);
    if (it === S.items[S.items.length - 1]) scrollEnd();
    if (it.kind === 'speak' && S.autoSpeak && !(opts && opts.silent)) speak(it.trans, it.dst, String(it.id));
  }
  async function runText(it, opts) {
    if (busy.has(it)) return;
    busy.add(it);
    it.status = 'pending'; it.err = null;
    updateItem(it);
    try {
      if (it.auto) {
        const r = await askJSON(promptAuto(it.orig));
        if (!r || typeof r.text !== 'string' || !r.text.trim()) throw { code: 'invalid_json' };
        const src = normCode(r.src);
        const mine = src === S.me;
        it.kind = mine ? 'speak' : 'listen';
        it.src = mine ? S.me : (src || '');
        it.dst = mine ? S.them : S.me;
        finish(it, r.text.trim(), opts);
      } else {
        const r = await askJSON(promptDirected(it.orig, it.src, it.dst));
        if (!r || typeof r.text !== 'string' || !r.text.trim()) throw { code: 'invalid_json' };
        finish(it, r.text.trim(), opts);
      }
    } catch (e) {
      it.status = 'error'; it.err = errText(e);
      updateItem(it);
    } finally {
      busy.delete(it);
    }
  }
  async function phrase(i) {
    const it = addItem({ kind: 'speak', src: S.me, dst: S.them, orig: PHRASES[i], trans: '', status: 'pending' });
    try { const pb = await ensurePB(S.them); finish(it, pb[IX.phrase + i]); }
    catch (e) { it.status = 'error'; it.err = errText(e); updateItem(it); }
  }
  async function reply(i, opts) {
    const it = addItem({ kind: 'speak', src: S.me, dst: S.them, orig: REPLY_FULL[i], trans: '', status: 'pending' });
    try { const pb = await ensurePB(S.them); finish(it, pb[IX.reply + i], opts); }
    catch (e) { it.status = 'error'; it.err = errText(e); updateItem(it); }
    return it;
  }

  /* ---------- compose (typing, and the preview's stand-in for the microphone) ---------- */
  let mode = null;
  function route(k) {
    if (k === 'listen') return CODE(S.them) + ' → ' + CODE(S.me);
    if (k === 'speak') return CODE(S.me) + ' → ' + CODE(S.them);
    return '글자 → ' + CODE(S.me);
  }
  function setMode(kind) {
    mode = kind || null;
    modeChip.hidden = !mode;
    if (mode) { modeChip.className = 'mode-chip ' + mode; modeLabel.textContent = (mode === 'speak' ? '말하기 ' : '듣기 ') + route(mode); }
    input.placeholder = mode === 'speak' ? nameKo(S.me) + '로 쓰면 ' + nameKo(S.them) + '로 읽어줘요'
      : mode === 'listen' ? '상대가 한 말(' + nameKo(S.them) + ')을 적어 주세요'
      : '글로 써도 돼요 · 언어는 알아서 맞춰요';
  }
  function onSubmit(e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendBtn.disabled = true;
    let it;
    if (mode === 'speak') it = addItem({ kind: 'speak', src: S.me, dst: S.them, orig: text, trans: '', status: 'pending' });
    else if (mode === 'listen') it = addItem({ kind: 'listen', src: S.them, dst: S.me, orig: text, trans: '', status: 'pending' });
    else {
      const looksMine = S.me === 'ko' && /[가-힣]/.test(text);
      it = addItem({ kind: looksMine ? 'speak' : 'listen', src: looksMine ? S.me : '', dst: looksMine ? S.them : S.me, orig: text, trans: '', status: 'pending', auto: true });
    }
    setMode(null);
    runText(it);
  }

  /* ---------- listening ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let micBlocked = !SR;
  try {
    const pp = document.permissionsPolicy || document.featurePolicy;
    if (pp && typeof pp.allowsFeature === 'function' && !pp.allowsFeature('microphone')) micBlocked = true;
  } catch (e) { /* no policy api */ }
  let rec = null, recKind = null, toldMic = false;

  function setRec(r, kind) {
    rec = r; recKind = r ? kind : null;
    for (const [b, k] of [[btnListen, 'listen'], [btnSpeak, 'speak']]) {
      const on = !!r && kind === k;
      b.classList.toggle('rec', on);
      b.querySelector('b').textContent = on ? '듣는 중' : (k === 'listen' ? '듣기' : '말하기');
      b.querySelector('small').textContent = on ? '누르면 끝' : route(k);
    }
  }
  function stopRec() { if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } } }
  function failToast(code, lang) {
    if (code === 'no-speech') toast('말소리가 들리지 않았어요. 다시 눌러서 말해 주세요.');
    else if (code === 'network') toast('인터넷 연결을 확인해 주세요.');
    else if (code === 'language-not-supported') toast(nameKo(lang) + '는 이 기기에서 알아듣지 못해요.');
  }
  // One utterance. Calls back onPartial(text), then onDone(text) or onFail(code). Returns the recognizer or null.
  function listen(lang, cb) {
    if (micBlocked) { cb.onFail('blocked'); return null; }
    let r;
    try { r = new SR(); } catch (e) { micBlocked = true; renderNote(); cb.onFail('blocked'); return null; }
    let finalText = '', interim = '', err = null, blocked = false;
    r.lang = L[lang].bcp; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    r.onresult = (ev) => {
      interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (res.isFinal) finalText += res[0].transcript; else interim += res[0].transcript;
      }
      if (cb.onPartial) cb.onPartial((finalText + interim).trim());
    };
    r.onerror = (ev) => {
      err = ev.error;
      if (err === 'not-allowed' || err === 'service-not-allowed' || err === 'audio-capture') { blocked = true; micBlocked = true; }
    };
    r.onend = () => {
      if (rec === r) setRec(null);
      const text = (finalText || interim).trim();
      if (blocked) { renderNote(); cb.onFail('blocked'); return; }
      if (text) cb.onDone(text); else cb.onFail(err || 'no-speech');
    };
    try { r.start(); } catch (e) { micBlocked = true; renderNote(); cb.onFail('blocked'); return null; }
    return r;
  }
  function fallback(kind) {
    setMode(kind);
    try { input.focus(); } catch (e) { /* ignore */ }
    if (!toldMic) { toldMic = true; toast('미리보기에선 마이크 대신 글로 받아요. 키보드의 마이크 버튼으로 말해도 돼요.', 4200); }
  }
  function voice(kind) {
    if (rec) { stopRec(); return; }
    if (micBlocked) { fallback(kind); return; }
    const src = kind === 'speak' ? S.me : S.them, dst = kind === 'speak' ? S.them : S.me;
    const it = addItem({ kind, src, dst, orig: '', trans: '', status: 'live' });
    const r = listen(src, {
      onPartial: (t) => { it.orig = t; const n = findNode(it); const o = n && n.querySelector('.orig'); if (o) o.textContent = t || '듣는 중…'; },
      onDone: (t) => { it.orig = t; runText(it); },
      onFail: (code) => { removeItem(it); if (code === 'blocked') fallback(kind); else failToast(code, src); },
    });
    if (r) setRec(r, kind);
  }

  /* ---------- speaking ---------- */
  let voices = [];
  const loadVoices = () => { try { voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch (e) { voices = []; } };
  if (window.speechSynthesis) { loadVoices(); try { window.speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) { /* old api */ } }
  function pickVoice(bcp) {
    if (!voices.length) loadVoices();
    const want = bcp.toLowerCase(), base = want.split('-')[0];
    const norm = (v) => String(v.lang || '').toLowerCase().replace('_', '-');
    return voices.find((v) => norm(v) === want) || voices.find((v) => norm(v).split('-')[0] === base) || null;
  }
  function markSpeaking(key, on) {
    document.querySelectorAll('.speaking').forEach((b) => b.classList.remove('speaking'));
    if (on && key) document.querySelectorAll('[data-say="' + key + '"]').forEach((b) => b.classList.add('speaking'));
  }
  let speakT = 0, toldVoice = false;
  function speak(text, code, key, onDone) {
    let doneOnce = false;
    const done = () => { if (!doneOnce) { doneOnce = true; if (onDone) onDone(); } };
    if (!text) { done(); return; }
    const synth = window.speechSynthesis;
    if (!synth || typeof window.SpeechSynthesisUtterance !== 'function') {
      if (!toldVoice) { toldVoice = true; toast('이 화면에선 소리를 낼 수 없어요. 앱(APK)에선 폰 음성으로 읽어줘요.', 3600); }
      done(); return;
    }
    try { synth.cancel(); } catch (e) { /* nothing queued */ }
    const l = L[code];
    const bcp = l ? l.bcp : (code || 'en');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = bcp;
    u.rate = S.slow ? 0.7 : 0.95;
    const v = pickVoice(bcp);
    if (v) u.voice = v;
    let started = false;
    u.onstart = () => { started = true; markSpeaking(key, true); };
    u.onend = () => { markSpeaking(key, false); done(); };
    u.onerror = () => { markSpeaking(key, false); done(); };
    synth.speak(u);
    clearTimeout(speakT);
    speakT = setTimeout(() => {
      if (!started && !synth.speaking) {
        if (!toldVoice) { toldVoice = true; toast('소리가 안 나면 이 기기에 ' + (l ? l.ko : '이 언어') + ' 읽기 음성이 없을 수 있어요. 앱(APK)에선 폰 음성으로 읽어줘요.', 4200); }
        done();
      }
    }, 2500);
  }

  /* ---------- seeing (photos) ---------- */
  async function prepImage(file) {
    let src;
    try { src = await createImageBitmap(file); }
    catch (e) {
      src = await new Promise((res, rej) => {
        const im = new Image(); const u = URL.createObjectURL(file);
        im.onload = () => { URL.revokeObjectURL(u); res(im); };
        im.onerror = () => { URL.revokeObjectURL(u); rej(e); };
        im.src = u;
      });
    }
    const w = src.width || src.naturalWidth, hh = src.height || src.naturalHeight;
    if (!w || !hh) throw new Error('empty image');
    const draw = (max) => {
      const k = Math.min(1, max / Math.max(w, hh));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(hh * k));
      const x = c.getContext('2d');
      x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(src, 0, 0, c.width, c.height);
      return c;
    };
    const bigC = draw(1568);
    const blob = await new Promise((res, rej) => bigC.toBlob((b) => (b ? res(b) : rej(new Error('encode'))), 'image/jpeg', 0.86));
    const thumb = draw(560).toDataURL('image/jpeg', 0.72);
    if (src.close) src.close();
    return { blob, thumb };
  }
  function validBox(b) {
    if (!Array.isArray(b) || b.length !== 4 || !b.every((n) => typeof n === 'number' && isFinite(n))) return null;
    if (b.some((n) => n < -5 || n > 1005)) return null;
    const v = b.map((n) => Math.round(Math.max(0, Math.min(1000, n))));
    return v[2] > v[0] && v[3] > v[1] ? v : null;
  }
  async function photo(file, opts) {
    opts = opts || {};
    const it = addItem({ kind: 'see', src: '', dst: '', cur: '', lines: [], status: 'pending', img: null, sample: !!opts.sample, order: {} });
    try {
      const p = await prepImage(file);
      it.img = p.thumb; blobs.set(it.id, p.blob);
      try { fullURL.set(it.id, URL.createObjectURL(p.blob)); } catch (e) { /* thumb only */ }
      updateItem(it); scrollEnd();
    } catch (e) {
      it.status = 'error'; it.err = '사진을 열지 못했어요. 다른 사진을 골라 주세요.';
      updateItem(it); return;
    }
    await runPhoto(it);

    try {
      const r = await askJSON(promptPhoto(), { images: [blob] });
      if (!r || !Array.isArray(r.lines)) throw { code: 'invalid_json' };
      it.lines = r.lines
        .filter((x) => x && typeof x.o === 'string' && typeof x.t === 'string' && (x.o.trim() || x.t.trim()))

    fThemSub.textContent = '';
    fMeInput.placeholder = nameKo(S.me) + '로 쓰기';
    $('#fMeReplies').replaceChildren(...(S.me === 'ko' ? REPLY_LABELS.map((lab, i) => h('button', { class: 'rchip', type: 'button', onclick: () => faceReply(i) }, lab)) : []));
    let pb = partnerUI();
    fThemText.textContent = pb ? pb[IX.ui + UI_GREET] : '…';
    langOn(fThemText, S.them);
    if (!pb && !engineOff()) {
      try { pb = await ensurePB(S.them); partnerUI(); if (fThemText.textContent === '…') fThemText.textContent = pb[IX.ui + UI_GREET]; }
      catch (e) { if (fThemText.textContent === '…') fThemText.textContent = 'Hello! Let’s talk with this translator.'; langOn(fThemText, 'en'); }
    } else if (!pb) { fThemText.textContent = 'Hello! Let’s talk with this translator.'; langOn(fThemText, 'en'); }
  }
  function closeFace() { face.hidden = true; stopRec(); markSpeaking(null, false); try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
  function partnerTurn() {
    if (face.hidden) return;
    if (!micBlocked) { faceMic('them'); return; }
    fThemForm.classList.remove('turn'); void fThemForm.offsetWidth; fThemForm.classList.add('turn');
  }
  async function faceSay(side, text) {
    const from = side === 'me' ? S.me : S.them, to = side === 'me' ? S.them : S.me;
    const T = side === 'me' ? fThemText : fMeText;
    const Sub = side === 'me' ? fThemSub : fMeSub;
    T.replaceChildren(dots()); Sub.textContent = '';
    const it = addItem({ kind: side === 'me' ? 'speak' : 'listen', src: from, dst: to, orig: text, trans: '', status: 'pending' });
    await runText(it, { silent: true });
    if (face.hidden) return;
    if (it.status !== 'done') { T.textContent = it.err || '번역하지 못했어요.'; langOn(T, 'ko'); return; }
    T.textContent = it.trans; langOn(T, to);
    if (side === 'them') { Sub.textContent = text; langOn(Sub, from); }
    speak(it.trans, to, null, () => { if (side === 'me') partnerTurn(); });
  }
  async function faceReply(i) {
    fThemText.replaceChildren(dots());
    const it = await reply(i, { silent: true });
    if (face.hidden) return;
    if (it.status !== 'done') { fThemText.textContent = it.err || '번역하지 못했어요.'; langOn(fThemText, 'ko'); return; }
    fThemText.textContent = it.trans; langOn(fThemText, S.them);
    speak(it.trans, S.them, null, partnerTurn);
  }
  function faceMic(side) {
    if (rec) { stopRec(); return; }
    const lang = side === 'me' ? S.me : S.them;
    const mic = side === 'me' ? fMeMic : fThemMic;
    const sub = side === 'me' ? fMeSub : fThemSub;
    const label = mic.querySelector('span');
    const idle = label.textContent;
    if (side === 'them') { const pb = pbGet(S.them); label.textContent = pb ? pb[IX.ui + UI_LISTEN] : 'Listening…'; } else label.textContent = '듣는 중 · 누르면 끝';
    mic.classList.add('rec');
    const end = () => { mic.classList.remove('rec'); label.textContent = idle; };
    const r = listen(lang, {
      onPartial: (t) => { sub.textContent = t; },
      onDone: (t) => { end(); sub.textContent = ''; faceSay(side, t); },
      onFail: (code) => { end(); if (code === 'blocked') faceInputs(); else failToast(code, lang); },
    });
    if (r) { rec = r; recKind = 'face'; }
  }
  function faceForm(side) {
    return (e) => {
      e.preventDefault();
      const inp = side === 'me' ? fMeInput : fThemInput;
      const t = inp.value.trim();
      if (!t) return;
      inp.value = '';
      faceSay(side, t);
    };
  }

  /* ---------- sheets ---------- */
  let lastFocus = null;
  function openSheet(title, body) {
    if (sheet.hidden) lastFocus = document.activeElement;
    sheetTitle.textContent = title;
    sheetBody.replaceChildren(body);
    sheetBody.scrollTop = 0;
    scrim.hidden = false; sheet.hidden = false;
    const f = sheetBody.querySelector('button,input,textarea');
    if (f) try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  function closeSheet() {
    if (sheet.hidden) return;
    scrim.hidden = true; sheet.hidden = true;
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }
  const opt = (icon, k, sub, fn) => h('button', { class: 'opt', type: 'button', onclick: fn }, ic(icon), h('span', { class: 'kn' }, h('b', null, k), h('small', null, sub)));

  function langSheet(who) {
    const cur = who === 'me' ? S.me : S.them;
    const list = h('div', { role: 'radiogroup', 'aria-label': who === 'me' ? '내 언어' : '상대 언어' });
    for (const l of LANGS) {
      if (who === 'them' && l.code === S.me) continue;
      const on = l.code === cur;
      list.append(h('button', { class: 'opt', type: 'button', role: 'radio', 'aria-checked': String(on), onclick: () => { chooseLang(who, l.code); closeSheet(); } },
        h('span', { class: 'tag' }, CODE(l.code)), h('span', { class: 'k' }, l.ko), langOn(h('span', { class: 'n' }, l.native), l.code), on ? ic('check', 'ck') : null));
    }
    openSheet(who === 'me' ? '내 언어' : '상대 언어', list);
    const sel = list.querySelector('[aria-checked="true"]');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }
  function chooseLang(who, code) {
    if (who === 'me') { if (code === S.them) S.them = S.me; S.me = code; }
    else S.them = code;
    if (S.them === S.me) S.them = S.me === 'en' ? 'ko' : 'en';
    store.set('me', S.me); store.set('them', S.them);
    renderLangs();
    renderFeed();
  }
  function seeSheet() {
    if (!photoReady()) return;
    openSheet('보기 · 사진 속 글자 번역', h('div', null,
      opt('camera', '카메라로 비추기', '글자 위에 번역이 겹쳐 보여요 (미리보기는 한 장 찍어서)', () => { closeSheet(); pickPhoto({ kind: 'see', mode: 'lens' }, true); }),
      opt('receipt', '메뉴판 찍고 주문하기', '먹을 것만 누르면 주문 문장을 만들어요', () => { closeSheet(); pickPhoto({ kind: 'see', mode: 'order' }, true); }),
      opt('album', '앨범에서 가져오기', '찍어 둔 사진이나 화면 캡처', () => { closeSheet(); pickPhoto({ kind: 'see', mode: 'list' }, false); }),
      opt('menu', '예시 메뉴판으로 해보기', '영어 카페 메뉴판으로 바로 확인', () => { closeSheet(); samplePhoto('lens'); })));
  }
  function settingsSheet() {
    const sw = (on, fn, label) => {
      const b = h('button', { class: 'sw', type: 'button', role: 'switch', 'aria-checked': String(on), 'aria-label': label });
      b.addEventListener('click', () => { const v = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', String(v)); fn(v); });
      return b;
    };
    const row = (label, sub, control) => h('div', { class: 'row' }, h('div', { class: 'row-t' }, h('b', null, label), h('small', null, sub)), control);
    let armed = false, armT = 0;
    const clear = h('button', { class: 'danger', type: 'button' }, '기록 모두 지우기');
    clear.addEventListener('click', () => {
      if (!S.items.length) { toast('지울 기록이 없어요.'); return; }
      if (!armed) {
        armed = true; clear.textContent = '한 번 더 누르면 모두 지워요';
        armT = setTimeout(() => { armed = false; clear.textContent = '기록 모두 지우기'; }, 3000);
        return;
      }
      clearTimeout(armT);
      for (const u of fullURL.values()) { try { URL.revokeObjectURL(u); } catch (e) { /* ignore */ } }
      S.items = []; blobs.clear(); fullURL.clear(); save(); renderFeed(); closeSheet(); toast('기록을 지웠어요.');
    });
    const wb = (icon, label, fn) => h('button', { class: 'w-b', type: 'button', onclick: () => { closeSheet(); fn(); } }, ic(icon), h('span', null, label));
    openSheet('설정', h('div', null,
      row('말하기 결과 바로 읽어주기', '번역되면 상대 언어로 소리 내 읽어요', sw(S.autoSpeak, (v) => { S.autoSpeak = v; store.set('autoSpeak', v); }, '말하기 결과 바로 읽어주기')),
      row('천천히 읽기', '외국 사람이 알아듣기 쉽게 느리게 읽어요', sw(S.slow, (v) => { S.slow = v; store.set('slow', v); }, '천천히 읽기')),
      h('div', { class: 'set-block' }, h('b', null, '홈 화면 위젯'),
        h('div', { class: 'widget' }, h('div', { class: 'w-head' }, h('span', { class: 'mark sm' }, ic('swap')), h('b', null, '이음')),
          h('div', { class: 'w-btns' }, wb('ear', '듣기', () => voice('listen')), wb('head', '말하기', () => voice('speak')), wb('eye', '보기', seeSheet))),
        h('small', null, '앱에선 홈 화면에 놓고, 누르면 앱이 열리자마자 마이크나 카메라가 켜져요. 여기선 눌러서 미리 써 보세요.')),
      h('div', { class: 'row' }, clear),
      h('p', { class: 'about' }, '이음 ' + VER + ' · 미리보기에선 Claude가 번역해요. 앱(APK)에선 폰 안에서 번역하고, 언어를 고르면 와이파이에서 번역 팩을 알아서 받아 둬서 인터넷 없이도 번역돼요.')));
  }

  /* ---------- copy ---------- */
  function copyFallback(text, okMsg) {
    const ta = h('textarea', { readonly: true, 'aria-hidden': 'true' });
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    toast(ok ? (okMsg || '복사했어요.') : '복사가 막혀 있어요. 글자를 길게 눌러 복사해 주세요.', okMsg ? 3600 : 2800);
  }
  function copyText(text, okMsg) {
    try { navigator.clipboard.writeText(text).then(() => toast(okMsg || '복사했어요.', okMsg ? 3600 : 2800), () => copyFallback(text, okMsg)); }
    catch (e) { copyFallback(text, okMsg); }
  }

  /* ---------- languages on screen ---------- */
  function renderLangs() {
    $('#meCode').textContent = CODE(S.me); $('#meName').textContent = nameKo(S.me);
    $('#themCode').textContent = CODE(S.them); $('#themName').textContent = nameKo(S.them);
    setRec(rec, recKind);
    btnSee.querySelector('small').textContent = route('see');
    btnListen.setAttribute('aria-label', '듣기: ' + nameKo(S.them) + ' 말을 듣고 ' + nameKo(S.me) + '로 보여줘요');
    btnSpeak.setAttribute('aria-label', '말하기: ' + nameKo(S.me) + '로 말하면 ' + nameKo(S.them) + '로 읽어줘요');
    btnSee.setAttribute('aria-label', '보기: 사진 속 글자를 번역해요');
    $('#phrases').hidden = S.me !== 'ko';
    setMode(mode);
  }

  /* ---------- wire up ---------- */
  document.querySelectorAll('svg[data-ic]').forEach((s) => {
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICONS[s.dataset.ic] || '';
  });
  $('#verTxt').textContent = VER;
  $('#phrases').replaceChildren(...PHRASES.map((p, i) => h('button', { class: 'chip', type: 'button', onclick: () => phrase(i) }, p)));
  $('#meBtn').addEventListener('click', () => langSheet('me'));
  $('#themBtn').addEventListener('click', () => langSheet('them'));
  $('#swapBtn').addEventListener('click', () => {
    stopRec();
    const t = S.me; S.me = S.them; S.them = t;
    store.set('me', S.me); store.set('them', S.them);
    $('#swapBtn').classList.toggle('spin');
    renderLangs(); renderFeed();
    toast('나 ' + nameKo(S.me) + ' ⇄ 상대 ' + nameKo(S.them), 1600);
  });
  $('#btnSet').addEventListener('click', settingsSheet);
  $('#tFace').addEventListener('click', openFace);
  $('#tAddr').addEventListener('click', showAddress);
  $('#tSos').addEventListener('click', showSOS);
  btnListen.addEventListener('click', () => voice('listen'));
  btnSpeak.addEventListener('click', () => voice('speak'));
  btnSee.addEventListener('click', seeSheet);
  scrim.addEventListener('click', closeSheet);
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#bigClose').addEventListener('click', closeBoard);
  $('#bigFlip').addEventListener('click', () => bigBody.classList.toggle('flip'));
  $('#lensClose').addEventListener('click', closeLens);
  $('#faceClose').addEventListener('click', closeFace);
  fThemForm.addEventListener('submit', faceForm('them'));
  fMeForm.addEventListener('submit', faceForm('me'));
  fThemMic.addEventListener('click', () => faceMic('them'));
  fMeMic.addEventListener('click', () => faceMic('me'));
  $('#modeX').addEventListener('click', () => { setMode(null); input.focus(); });
  input.addEventListener('input', () => { sendBtn.disabled = !input.value.trim(); });
  form.addEventListener('submit', onSubmit);
  fileCam.addEventListener('change', onFile);
  fileAlbum.addEventListener('change', onFile);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!sheet.hidden) closeSheet();
    else if (!big.hidden) closeBoard();
    else if (!lens.hidden) closeLens();
    else if (!face.hidden) closeFace();
  });
  // Entry point the app's home-screen widget will call: listen | speak | see | face | sos | addr
  window.tongyeokOpen = (what) => ({ listen: () => voice('listen'), speak: () => voice('speak'), see: seeSheet, face: openFace, sos: showSOS, addr: showAddress }[what] || (() => {}))();

  renderLangs();
  renderNote();
  renderFeed();
  if (S.items.length) scrollEnd();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { if (!S.items.length) { redrawExample(); renderFeed(); } }).catch(() => {});
  }
})();
</script>
