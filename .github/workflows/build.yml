# [이음용] build.yml - dlsdml99-create/ieum 저장소 전용
name: 이음 APK 만들기
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'site/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# 앱 빌드와 페이지만 올리기가 동시에 돌면 페이지가 예전 버전으로 덮일 수 있어 차례로 실행
concurrency: { group: release, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 확인
        run: |
          if [ "${{ github.repository }}" != "dlsdml99-create/ieum" ]; then
            echo "::error::이 build.yml은 이음(ieum) 저장소용이에요."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.7'
      - name: 버전 정하기
        run: echo "VER=$(( ${{ github.run_number }} + 3 ))" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          KEY_PASS: ${{ secrets.IEUM_KEY }}
        run: |
          set -o pipefail
          # 비밀값이 로그에 찍혀도 가려지게
          [ -n "$KEY_PASS" ] && echo "::add-mask::$KEY_PASS"
          if [ -z "$KEY_PASS" ]; then
            echo "::error::서명 비밀값(IEUM_KEY)이 없어요. 저장소 Settings → Secrets and variables → Actions 에서 넣어 주세요." | tee build.log
            exit 1
          fi
          printf '%s' "$KEY_PASS" > "$RUNNER_TEMP/kp"
          openssl enc -d -aes-256-cbc -pbkdf2 -in app/ieum.jks.enc -out app/ieum.jks -pass file:"$RUNNER_TEMP/kp"
          rm -f "$RUNNER_TEMP/kp"
          # 화면(웹)에 보이는 버전 번호도 앱 버전과 같은 번호로
          sed -i "s/__APPVER__/1.$VER/g" app/src/main/assets/index.html
          grep -q "__APPVER__" app/src/main/assets/index.html && { echo "::error::버전 번호를 넣지 못했어요"; exit 1; }
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          rm -f app/ieum.jks
          cp app/build/outputs/apk/release/app-release.apk ieum.apk
          ls -la ieum.apk
      # 실패했을 때: 공개 브랜치에 올리지 않고, 비밀값을 지운 로그 요약만 이 실행 화면과 실행 첨부 파일(3일)에 남김
      # 주의: 공개 저장소라 실행 첨부 파일은 GitHub에 로그인한 사람은 누구나 받을 수 있음. 그래서 비밀값은 지운 뒤 올림
      - name: 빌드 기록 요약 (실패했을 때만)
        if: failure()
        env:
          KEY_PASS: ${{ secrets.IEUM_KEY }}
        run: |
          [ -n "$KEY_PASS" ] && echo "::add-mask::$KEY_PASS"
          mkdir -p /tmp/lg
          [ -f build.log ] || echo "no log" > build.log
          python3 - <<'PY'
          import os
          k = os.environ.get('KEY_PASS', '')
          t = open('build.log', encoding='utf-8', errors='replace').read()
          if k:
              t = t.replace(k, '***')
          open('/tmp/lg/build-summary.log', 'w', encoding='utf-8').write('\n'.join(t.splitlines()[-200:]) + '\n')
          PY
          tail -n 60 /tmp/lg/build-summary.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: build-summary
          path: /tmp/lg/build-summary.log
          retention-days: 3
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MB=$(du -m ieum.apk | cut -f1)
          sed -i "s/__N__/$VER/g; s/__MB__/$MB/g" notes.md site/index.html
          gh release delete "v$VER" --yes --cleanup-tag || true
          gh release create "v$VER" ieum.apk --latest --title "이음 v1.$VER" --notes-file notes.md
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  pages:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
