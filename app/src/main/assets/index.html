<style>
/* Layout: one-screen wayfinding board. Graphite sign band (tools + languages) on top, the conversation in the middle, three yellow signs (ear · mouth · eye) as the dock. Full-screen boards for showing things to the other person. */
:root{
  --bg:#EDEDE7;
  --surface:#FFFFFF;
  --ink:#16181B;
  --muted:#5B605D;
  --line:#D2D3CB;
  --sign:#FFCC00;
  --on-sign:#16181B;
  --sign-muted:#5C4B00;
  --sign-hover:rgba(22,24,27,.09);
  --board:#1E2125;
  --on-board:#F2F2EC;
  --board-muted:#A6AAAE;
  --board-line:rgba(255,255,255,.13);
  --board-hover:rgba(255,255,255,.08);
  --blue:#1C5DAE;
  --rec:#D63A1E;
  --on-rec:#FFFFFF;
  --rec-line:rgba(255,255,255,.55);
  --rec-shade:rgba(0,0,0,.2);
  --sos-ink:#FF6A4D;
  --lens:#0C0D0F;
  --on-lens:#F2F2EC;
  --scrim:rgba(10,12,14,.5);
  --shadow:0 8px 28px rgba(0,0,0,.22);
  --tag-shadow:0 1px 4px rgba(0,0,0,.4);
  --f-sign:"Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --f-body:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101214;--surface:#1A1D20;--ink:#ECEDE7;--muted:#9EA3A0;--line:#2C3034;
    --board:#24282D;--board-line:rgba(255,255,255,.1);
    --blue:#7DAEEE;--rec:#E2472B;--scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101214;--surface:#1A1D20;--ink:#ECEDE7;--muted:#9EA3A0;--line:#2C3034;
  --board:#24282D;--board-line:rgba(255,255,255,.1);
  --blue:#7DAEEE;--rec:#E2472B;--scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--board);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
p{margin:0}
[lang]:not([lang|="ko"]){word-break:normal}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.app{height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grow{flex:1}

/* sign band */
.top{flex:none;background:var(--board);color:var(--on-board)}
.top .wrap{padding-block:4px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.brand{display:flex;align-items:center;gap:8px;min-height:46px}
.mark{width:28px;height:28px;border-radius:4px;background:var(--sign);color:var(--on-sign);display:grid;place-items:center;flex:none}
.mark .i{width:18px;height:18px;stroke-width:2.6}
.mark.sm{width:20px;height:20px;border-radius:3px}
.mark.sm .i{width:13px;height:13px}
.logo{width:30px;height:30px;flex:none;border-radius:8px;overflow:hidden;display:block}
.logo svg{display:block}
.brand h1{margin:0;font-size:20px;line-height:1;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.tools{display:flex;gap:2px;flex:none}
.tool{width:44px;height:46px;display:grid;justify-items:center;align-content:center;gap:3px;border-radius:var(--r);color:var(--on-board)}
.tool .i{width:20px;height:20px}
.tool span{font-size:12px;line-height:1;color:var(--board-muted);white-space:nowrap;letter-spacing:-.02em}
.tool.sos b{font-family:var(--f-sign);font-weight:700;font-size:16px;line-height:20px;letter-spacing:.04em;color:var(--sos-ink)}
.langs{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1fr);align-items:center;gap:6px}
.plate{display:flex;align-items:center;gap:8px;min-width:0;height:46px;padding:0 10px;border-radius:var(--r);border:1px solid var(--board-line);text-align:left}
.who{font-size:12px;color:var(--board-muted);flex:none}
.code{font-family:var(--f-sign);font-weight:700;font-size:24px;line-height:1;color:var(--sign);letter-spacing:.02em;flex:none}
.nm{font-weight:500;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plate .chev{width:16px;height:16px;color:var(--board-muted)}
.arrows{width:36px;height:46px;border-radius:var(--r);color:var(--sign);display:grid;place-items:center}
.arrows .i{width:22px;height:22px;transition:transform .3s ease}
.arrows.spin .i{transform:rotate(180deg)}
@media (hover:hover){.arrows:hover{background:var(--board-hover)}}

/* conversation */
.feed{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.feed-in{padding-block:14px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
#feedNote:empty{display:none}
.empty{display:grid;justify-items:center;gap:6px;text-align:center;padding:40px 12px;color:var(--muted)}
.empty b{color:var(--ink);font-size:17px}
.empty .act-b{margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:0 14px}
.list{display:flex;flex-direction:column;gap:10px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r);font-size:13px;color:var(--muted)}
.note .i{width:18px;height:18px;margin-top:1px}
.note p{flex:1;min-width:0}
.note button{flex:none;min-height:44px;font-size:13px;font-weight:700;color:var(--ink);padding:2px 8px;margin:-10px -4px -10px 0}
.card{border-radius:var(--r);padding:11px 14px 8px;display:grid;gap:3px;min-width:0}
.card.speak{background:var(--sign);color:var(--on-sign);margin-left:10%}
.card.listen{background:var(--board);color:var(--on-board);border:1px solid var(--board-line);margin-right:10%}
.card.see{background:var(--surface);border:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:8px;min-height:24px;font-size:12px;font-weight:700}
.card-h .i{width:16px;height:16px}
.route{font-family:var(--f-sign);font-weight:600;font-size:13px;letter-spacing:.06em}
.ex{margin-left:auto;font-size:11px;font-weight:500;padding:0 6px;border:1px solid currentColor;border-radius:3px;opacity:.65}
.cur-chip{margin-left:auto;display:inline-flex;align-items:center;gap:2px;height:24px;padding:0 4px 0 7px;border-radius:3px;background:var(--board);color:var(--sign);font-family:var(--f-sign);font-weight:700;font-size:13px;letter-spacing:.04em}
.cur-chip .i{width:14px;height:14px}
.cur-chip ~ .ex{margin-left:0}
.orig{font-size:14px;overflow-wrap:anywhere}
.card.speak .orig{color:var(--sign-muted)}
.card.listen .orig{color:var(--board-muted)}
.trans{font-size:19px;line-height:1.38;font-weight:700;overflow-wrap:anywhere}
.trans.long{font-size:17px}
.err{font-size:14px;font-weight:500;padding-block:2px}
.acts{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0 0 -8px}
.ffind{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.ffind-in{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--card,transparent)}
.ffind-in input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:inherit;outline:none}
.ffind-star{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:700;white-space:nowrap}
.ffind-star[aria-pressed="true"]{background:var(--sign,#F5B400);border-color:var(--sign,#F5B400);color:#1a1405}
.ffind-star[aria-pressed="true"] svg,.act-b.on svg{fill:currentColor}
.act-b.on{font-weight:700}
.fnone{padding:24px 8px;text-align:center;font-size:14px;opacity:.75}
.act-b{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 8px;border-radius:4px;font-size:13px;font-weight:500}
.act-b .i{width:18px;height:18px}
.act-b em{font-style:normal;font-family:var(--f-sign);font-weight:700;background:var(--sign);color:var(--on-sign);border-radius:3px;padding:0 5px;line-height:18px}
.kick{font-size:11px;font-weight:700;color:var(--board-muted);margin-top:6px}
.replies{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.rchip{height:44px;padding:0 11px;border-radius:4px;border:1px solid var(--board-line);color:var(--on-board);font-size:13px;font-weight:500}
.speaking .w1{animation:wave 1s infinite}
.speaking .w2{animation:wave 1s .25s infinite}
@keyframes wave{0%,100%{opacity:.2}50%{opacity:1}}
.dots{display:inline-flex;gap:5px;align-items:center;height:26px}
.dots i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.25;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}40%{opacity:1}}
.wait{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.see-pic{display:block;width:100%;padding:0;margin:4px 0 2px;border-radius:4px;overflow:hidden;position:relative}
.see-img{display:block;width:100%;max-width:100%;height:150px;object-fit:cover;background:var(--bg)}
.see-img.ph{animation:blink 1.6s infinite;border-radius:4px;margin:4px 0 2px}
.see-pic .over{position:absolute;right:6px;bottom:6px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:3px;background:var(--board);color:var(--sign);font-size:12px;font-weight:700}
.see-pic .over .i{width:14px;height:14px}
.lines{list-style:none;margin:2px 0 0;padding:0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.line .o,.line .t,.line .pr{grid-column:1;overflow-wrap:anywhere}
.line .o{font-size:13px;color:var(--muted)}
.line .t{font-size:16px;font-weight:700}
.line .pr{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-family:var(--f-sign);font-size:14px;font-weight:600;color:var(--muted)}
.line .pr b{color:var(--ink);font-weight:700}
.line .say{grid-column:2;grid-row:1/span 3;width:40px;height:40px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}

/* dock */
.dock{flex:none;background:var(--bg);border-top:1px solid var(--line)}
.dock .wrap{padding-block:8px 4px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.phrases{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.phrases::-webkit-scrollbar{display:none}
.sits{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}.sits::-webkit-scrollbar{display:none}
.sits button{flex:none;height:44px;padding:0 12px;border:0;border-radius:18px;background:transparent;color:var(--ink-2,inherit);font:inherit;font-size:12.5px;font-weight:600}
.sits button[aria-selected="true"]{background:var(--ink,#111);color:var(--surface,#fff)}
.tzsug{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}
.tzsug span{flex:1;min-width:0}.tzx{flex:none;width:44px;height:44px;border:0;background:transparent;color:inherit;display:grid;place-items:center}
.pron{margin:2px 0 0;font-size:14px;color:var(--muted,#667);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.pron span{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.chip-hint{font-size:13px;color:var(--muted,#667);white-space:normal;padding:6px 2px}
.chip{flex:none;height:44px;padding:0 11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.compose{display:flex;gap:6px;margin:0}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:44px;padding:0 4px 0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field:focus-within{border-color:var(--ink)}
.field input{flex:1;width:0;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px}
.field input::placeholder{color:var(--muted)}
.mode-chip{flex:none;display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 2px 0 8px;border-radius:3px;font-size:12px;font-weight:700;white-space:nowrap}
.mode-chip.speak{background:var(--sign);color:var(--on-sign)}
.mode-chip.listen{background:var(--board);color:var(--on-board)}
.mode-chip button{width:24px;height:24px;display:grid;place-items:center}
.mode-chip .i{width:14px;height:14px}
.send{flex:none;width:44px;height:44px;border-radius:var(--r);background:var(--board);color:var(--sign);display:grid;place-items:center}
.send:disabled{opacity:.35}
.signs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sign{position:relative;min-height:76px;padding:8px 4px 9px;border-radius:8px;background:var(--sign);color:var(--on-sign);display:grid;justify-items:center;align-content:center;gap:3px;transition:transform .12s ease}
.sign:active{transform:scale(.97)}
.sign .i{width:28px;height:28px;stroke-width:2.2}
.sign b{font-size:16px;line-height:1.2}
.sign small{font-family:var(--f-sign);font-weight:600;font-size:12px;line-height:1;letter-spacing:.06em}
.sign.rec{background:var(--rec);color:var(--on-rec)}
.sign.rec::after{content:"";position:absolute;inset:-4px;border:2px solid var(--rec);border-radius:11px;animation:ring 1.3s ease-out infinite;pointer-events:none}
@keyframes ring{from{opacity:.9;transform:scale(.98)}to{opacity:0;transform:scale(1.06)}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;margin:-8px 0 -4px;font-size:11px;color:var(--muted)}
.ver{position:relative;display:inline-flex;align-items:center;min-width:56px;height:44px;font-family:var(--f-sign);font-weight:600;font-size:12px;letter-spacing:.05em;color:var(--muted);padding:0 12px 0 0;margin:0;border:0;background:transparent}
.phrases.more,.sits.more{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
.row.stack{flex-wrap:wrap}.row.stack .row-t{flex:1 1 100%}.row.stack .seg{width:100%}.row.stack .seg button{flex:1}
.seg{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-width:56px;height:44px;padding:0 10px;font-size:14px;font-weight:700;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--board);color:var(--sign)}
.zoomed .plate .nm{display:none}
.chip.add{border-style:dashed;font-weight:700}
.chip.wait{color:var(--muted);border-style:dashed}
.wait-why{font-size:12px;opacity:.8}
.more-b{justify-self:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:700;color:var(--ink)}
.set-btn{flex:none;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:700}
.sos-guess{font-size:12px;font-weight:500;opacity:.85}

/* face to face */
.face{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;background:var(--board)}
.half{flex:1;min-height:0;display:flex}
.half.them{background:var(--sign);color:var(--on-sign);transform:rotate(180deg);padding-bottom:env(safe-area-inset-top,0px)}
.half.me{background:var(--board);color:var(--on-board);padding-bottom:env(safe-area-inset-bottom,0px)}
.half-in{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.fh-lang{font-family:var(--f-sign);font-weight:700;font-size:13px;letter-spacing:.06em;opacity:.7}
.fh-text{flex:1;font-size:clamp(20px,6vw,30px);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.fh-sub{font-size:14px;opacity:.72;overflow-wrap:anywhere}
.fh-sub:empty{display:none}
.fh-replies{display:flex;flex-wrap:wrap;gap:6px}
.fh-form{display:flex;gap:6px;margin:0;border-radius:var(--r)}
.fh-form input{flex:1;width:0;min-width:0;height:46px;border-radius:var(--r);border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:16px;padding:0 12px;outline:0}
.fh-form input::placeholder{color:inherit;opacity:.6}
.fh-form button{flex:none;width:46px;height:46px;border-radius:var(--r);display:grid;place-items:center}
.half.them .fh-form button{background:var(--on-sign);color:var(--sign)}
.half.me .fh-form button{background:var(--sign);color:var(--on-sign)}
.fh-form.turn{animation:turn .9s ease 2}
@keyframes turn{50%{box-shadow:0 0 0 6px var(--on-sign)}}
.fh-mic{flex:none;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px}
.fh-mic .i{width:22px;height:22px}
.half.them .fh-mic{background:var(--on-sign);color:var(--sign)}
.half.me .fh-mic{background:var(--sign);color:var(--on-sign)}
.half .fh-mic.rec{background:var(--rec);color:var(--on-rec)}
.face-mid{position:relative;z-index:2;flex:none;display:flex;align-items:center;gap:8px;padding:4px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));background:var(--board);color:var(--on-board);border-block:1px solid var(--board-line)}
.fm-route{font-family:var(--f-sign);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--sign)}
.fm-b{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:var(--r);font-weight:700;font-size:14px}

/* photo lens */
.lens{position:fixed;inset:0;z-index:52;display:flex;flex-direction:column;gap:8px;background:var(--lens);color:var(--on-lens);padding:calc(env(safe-area-inset-top,0px) + 6px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.lens-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lens-t{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.lens-stage{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.lens-pic{position:relative;max-width:100%}
.lens-pic img{display:block;width:100%;height:100%;object-fit:contain;border-radius:4px}
.lens-tags{position:absolute;inset:0}
.lens-pic video{display:block;width:100%;height:100%;object-fit:contain;border-radius:4px;background:#000}
.ver.new{color:var(--rec);text-decoration:underline}
.lens-tag{position:absolute;padding:1px 4px;border-radius:3px;background:var(--sign);color:var(--on-sign);font-weight:700;line-height:1.15;text-align:left;box-shadow:var(--tag-shadow);overflow-wrap:anywhere}

<script>
(() => {
  'use strict';
  const VER = 'v' + window.IEUM_VER();
  const $ = (s) => document.querySelector(s);
  document.documentElement.lang = 'ko';

  /* ---------- languages ---------- */
  const LANGS = [
    ['ko', '한국어', '한국어', 'Korean', 'ko-KR'],
    ['en', '영어', 'English', 'English', 'en-US'],
    ['ja', '일본어', '日本語', 'Japanese', 'ja-JP'],
    ['zh', '중국어', '中文', 'Chinese (Simplified)', 'zh-CN'],
    ['vi', '베트남어', 'Tiếng Việt', 'Vietnamese', 'vi-VN'],
    ['th', '태국어', 'ไทย', 'Thai', 'th-TH'],
    ['id', '인도네시아어', 'Bahasa Indonesia', 'Indonesian', 'id-ID'],
    ['ms', '말레이어', 'Bahasa Melayu', 'Malay', 'ms-MY'],
    ['tl', '필리핀어', 'Filipino', 'Filipino', 'fil-PH'],
    ['es', '스페인어', 'Español', 'Spanish', 'es-ES'],
    ['fr', '프랑스어', 'Français', 'French', 'fr-FR'],
    ['de', '독일어', 'Deutsch', 'German', 'de-DE'],
    ['it', '이탈리아어', 'Italiano', 'Italian', 'it-IT'],
    ['pt', '포르투갈어', 'Português', 'Portuguese', 'pt-PT'],
    ['ru', '러시아어', 'Русский', 'Russian', 'ru-RU'],
    ['tr', '튀르키예어', 'Türkçe', 'Turkish', 'tr-TR'],
    ['ar', '아랍어', 'العربية', 'Arabic', 'ar-SA'],
    ['hi', '힌디어', 'हिन्दी', 'Hindi', 'hi-IN'],
    ['nl', '네덜란드어', 'Nederlands', 'Dutch', 'nl-NL'],
  ].map(([code, ko, native, en, bcp]) => ({ code, ko, native, en, bcp }));
  const L = Object.fromEntries(LANGS.map((l) => [l.code, l]));
  const CODE = (c) => (c ? String(c).split('-')[0].toUpperCase() : '··');
  const nameKo = (c) => (L[c] ? L[c].ko : CODE(c));
  const langAttr = (c) => (/^[a-z]{2,3}$/.test(c || '') ? c : null);
  const str = (v) => (typeof v === 'string' ? v.trim() : '');
  function normCode(s) {
    s = String(s || '').trim().toLowerCase();
    if (!s) return '';
    const base = s.split(/[-_\s]/)[0];
    if (L[base]) return base;
    if (base === 'fil') return 'tl';
    const byName = LANGS.find((l) => l.en.toLowerCase().split(' ')[0] === base);

  async function sitPhrase(t) {

  /* ---------- 해외에 가면 폰 시간대를 보고 상대 언어 바꾸기를 한 번 제안 (인터넷·위치 권한 안 씀) ---------- */

  /* ---------- compose (typing, and the preview's stand-in for the microphone) ---------- */
  let mode = null;

  const micBlocked = false;

  /* ---------- speaking (the phone's text-to-speech) ---------- */

  const SCRIPT = { ja: 'ja', zh: 'zh', hi: 'hi', ko: 'ko' };

  function detectCur(t, src) {
    if (/₫|\bVND\b|\d\s?đ(?!\p{L})|đồng/iu.test(t)) return 'VND';
    if (/€|\bEUR\b/.test(t)) return 'EUR';
    if (/£|\bGBP\b/.test(t)) return 'GBP';
    if (/฿|บาท|\bTHB\b/.test(t)) return 'THB';
    if (/円|\bJPY\b/.test(t)) return 'JPY';
    if (/元|\bRMB\b|\bCNY\b/.test(t)) return 'CNY';
    if (/¥/.test(t)) return src === 'zh' ? 'CNY' : 'JPY';
    if (/HK\$/.test(t)) return 'HKD';
    if (/NT\$/.test(t)) return 'TWD';
    if (/S\$/.test(t)) return 'SGD';
    if (/\bRM\s?\d/.test(t)) return 'MYR';
    if (/\bRp\.?\s?\d/.test(t)) return 'IDR';
    if (/₱|\bPHP\b/.test(t)) return 'PHP';
    if (/₹|\bRs\.?\s?\d/.test(t)) return 'INR';
    if (/₺/.test(t)) return 'TRY';
    if (/\$|\bUSD\b/.test(t)) return DOLLAR[S.country] || 'USD';

  }
  const PRICE_AT_END = /(?:^|[\s.:·…_\-–—|])((?:US\$|HK\$|NT\$|S\$|RM|Rp\.?|[$€£¥₩₫฿₱₹])?\s?\d[\d.,\s]*\d|\d)\s*(원|円|元|₫|đ|VND|฿|บาท|€|\$|¥|,-)?\s*$/;
  function parseNum(raw, cur) {
    const s = String(raw).replace(/[^\d.,]/g, '');
    if (!s) return null;

    else {
      const m = /^(.*?)[.,](\d{1,2})$/.exec(s);

  function splitPrice(text, cur) {
    if (/\d{1,2}:\d{2}/.test(text)) return null;
    const m = PRICE_AT_END.exec(text);
    if (!m) return null;
    const name = text.slice(0, m.index).replace(/[\s.:·…_\-–—|]+$/, '').trim();
    if (!/\p{L}/u.test(name)) return null;
    // a bare small number after a place word is part of an address or sign ("District 1", "Exit 3"), not a price
    const bare = /^\d+$/.test(m[1].trim()) && !m[2];
    if (bare && /(street|\bst\b|road|avenue|district|floor|room|gate|exit|platform|line|bus|terminal|hall|no\.?|번|층|호|号|番|線|区|quận|phường|tầng)\s*$/iu.test(name)) return null;
    const price = parseNum(m[1], cur);
    return price ? { name, price } : null;
  }
  // Lines read on the same height become one row (menu names and prices are often read apart).
  function rowsOf(lines) {
    const ls = (lines || []).filter((l) => l && typeof l.t === 'string' && l.t.trim() && Array.isArray(l.b) && l.b.length === 4)
      .map((l) => ({ t: l.t.trim(), b: l.b.map(Number) }));
    ls.sort((a, b) => (a.b[1] + a.b[3]) - (b.b[1] + b.b[3]));
    const rows = [];
    for (const l of ls) {
      const g = rows[rows.length - 1];
      if (g) {
        const f = g[0];
        const tol = Math.min(f.b[3] - f.b[1], l.b[3] - l.b[1]) * 0.55;
        if (Math.abs((f.b[1] + f.b[3]) / 2 - (l.b[1] + l.b[3]) / 2) <= tol) { g.push(l); continue; }
      }
      rows.push([l]);
    }
    return rows.map((g) => {
      g.sort((a, b) => a.b[0] - b.b[0]);
      return { t: g.map((x) => x.t).join('  '),
        b: [Math.min(...g.map((x) => x.b[0])), Math.min(...g.map((x) => x.b[1])), Math.max(...g.map((x) => x.b[2])), Math.max(...g.map((x) => x.b[3]))].map(Math.round) };
    });
  }
  async function readRows(rows) {

    const dst = src === S.me ? S.them : S.me;
    const cur = detectCur(all, src);
    const parsed = rows.map((r) => { const m = splitPrice(r.t, cur); return { o: m ? m.name : r.t, p: m ? m.price : null, b: r.b }; });
    const tr = await trMany(parsed.map((x) => x.o), src, dst);
    return { src, dst, cur, lines: parsed.map((x, i) => ({ o: x.o, t: tr[i] || x.o, p: x.p, b: x.b })) };
  }
  function thumbOf(url, max) {

      im.onload = () => {

          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));

      bk.pending = null; bkSet('앱 저장 공간이 가득 차서 불러오지 못했어요. 원래 기록은 그대로예요. 오래된 기록을 지운 뒤 다시 해 주세요.'); return;
    }
    /* 다시 열리기 전에 앱이 예전 기록을 덮어쓰지 못하게 잠금 */
    SP.setItem = function (k, v) { if (this === localStorage && bkMatch(k)) return; return set0.apply(this, arguments); };
    SP.removeItem = function (k) { if (this === localStorage && bkMatch(k)) return; return rm0.apply(this, arguments); };
    Promise.all((B.idb || []).map(function (d) { var rows = o.idb && o.idb[d.db + '/' + d.store]; return rows ? idbLoad(d, rows) : Promise.resolve(); })).then(function () {
      bkSet('다 불러왔어요! 잠깐 뒤 다시 열려요.', true); setTimeout(function () { try { location.reload(); } catch (e) { /* 무시 */ } }, 700);
    });
  }
  function bkHTML() {
    if (!B) return '';
    var p = bk.pending, when = p && p.at ? new Date(p.at) : null;
    return '<p class="lbl">내 데이터 백업</p>' +
      (p ? '<p class="hint">' + esc((when && !isNaN(when) ? (when.getMonth() + 1) + '월 ' + when.getDate() + '일 ' : '') + '백업 (v' + (p.version || '?') + ')') + '을 불러오면 지금 이 폰의 ' + esc(C.name) + ' 기록이 백업 내용으로 바뀌어요.</p>' +
        '<div class="row"><button class="btn main" type="button" data-bk="apply"' + (bk.busy ? ' disabled' : '') + '>불러오기</button><button class="btn" type="button" data-bk="cancel">취소</button></div>'
      : bk.locked ? '<p class="hint">🔒 비밀번호가 걸린 백업이에요. 저장할 때 넣은 비밀번호를 넣어 주세요.</p><input class="pw" id="bk-upw" type="password" autocomplete="off" maxlength="40" placeholder="백업 비밀번호" aria-label="백업 비밀번호"><div class="row"><button class="btn main" type="button" data-bk="unlock"' + (bk.busy ? ' disabled' : '') + '>열기</button><button class="btn" type="button" data-bk="cancel">취소</button></div>'
      : '<p class="hint">폰을 바꾸거나 앱을 지우기 전에 파일로 저장해 두세요. 파일은 내가 고른 곳에만 저장되고 인터넷으로 보내지 않아요. 비밀번호를 넣으면 그 비밀번호를 아는 사람만 열 수 있어요(잊으면 열 수 없어요).</p>' +
        (BLOCK.ok() ? '<input class="pw" id="bk-pw" type="password" autocomplete="new-password" maxlength="40" placeholder="비밀번호 (선택, ' + PW_MIN + '글자 이상)" aria-label="백업 비밀번호 (선택, ' + PW_MIN + '글자 이상)">' : '') +
        '<div class="row"><button class="btn" type="button" data-bk="save"' + (bk.busy ? ' disabled' : '') + '>백업 파일로 저장</button><button class="btn" type="button" data-bk="open"' + (bk.busy ? ' disabled' : '') + '>백업 불러오기</button></div>') +
      (bk.msg ? '<p class="hint" role="status">' + esc(bk.msg) + '</p>' : '');
  }
  function render() {
    var up = hasUpdate();
    var notes = (C.notes || []).map(function (n) {
      var v = n.v === 'current' ? 'v' + cur() : n.v;
      return '<li><div class="nh"><b>' + esc(v) + '</b><span>' + esc(n.d || '') + '</span></div><ul>' +
        (n.items || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></li>';
    }).join('');
    root.innerHTML = '<style>' + CSS + '</style><div class="w' + themeCls() + '"><div class="scrim" data-x></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(C.name) + ' 앱 정보" tabindex="-1">' +
      '<div class="grab"></div><div class="head"><h2>' + esc(C.name) + '<span class="vtag' + (up ? ' up' : '') + '">v' + esc(cur()) + '</span></h2>' +
      '<button class="x" type="button" data-x aria-label="닫기">×</button></div>' +
      '<p class="msg">' + statusHTML() + '</p>' +
      '<div class="row">' + (up && latest.url ? '<a class="btn main" href="' + esc(latest.url) + '" target="_blank" rel="noopener">업데이트 받기</a>' : '') +
      (C.online ? '<button class="btn" type="button" data-chk' + (checking ? ' disabled' : '') + '>새 버전 확인</button>' : '') + '</div>' +
      bkHTML() +
      '<p class="lbl">업데이트 내용</p><ul class="notes">' + notes + '</ul>' +
      '<p class="lbl">개인정보</p><p class="hint">' + esc(C.privacy || '') + '</p></div></div>';
    root.querySelectorAll('[data-x]').forEach(function (b) { b.addEventListener('click', close); });
    var c = root.querySelector('[data-chk]');
    if (c) c.addEventListener('click', function () { check(true); });
    root.querySelectorAll('[data-bk]').forEach(function (b) { b.addEventListener('click', function () { var k = b.getAttribute('data-bk'); if (k === 'save') bkSave(); else if (k === 'open') bkOpen(); else if (k === 'apply') bkApply(); else if (k === 'unlock') bkUnlock(); else { bk.pending = null; bk.locked = null; bkSet(''); } }); });
  }
  function open() { isOpen = true; host.style.display = 'block'; render(); var sh = root.querySelector('.sheet'); if (sh) sh.focus(); if (C.online && !checking && (!latest || Date.now() - (latest.at || 0) > 600000)) check(false); }
  function close() { isOpen = false; host.style.display = 'none'; root.innerHTML = ''; try { label.focus(); } catch (e) { /* 무시 */ } }
  document.addEventListener('keydown', function (e) { if (isOpen && e.key === 'Escape') close(); });
  /* 뒤로 가기 키: 창이 열려 있으면 창부터 닫음 (앱이 나중에 onBackKey를 바꿔도 유지) */
  var prevBack = window.onBackKey;
  Object.defineProperty(window, 'onBackKey', { configurable: true, get: function () { return wrapped; }, set: function (f) { prevBack = f; } });
  function wrapped() { if (isOpen) { close(); return true; } return typeof prevBack === 'function' ? prevBack.apply(this, arguments) : false; }

  function check(manual) {
    if (!C.online || checking) return;
    checking = true; failed = false; if (isOpen) render();
    var done = function () { checking = false; paint(); if (isOpen) render(); };
    fetch('https://api.github.com/repos/' + C.repo + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (j) {
        var own = 'https://github.com/' + C.repo + '/releases/', url = own + 'latest';
        if (typeof j.html_url === 'string' && j.html_url.indexOf(own) === 0) url = j.html_url;
        (j.assets || []).forEach(function (a) { if (a && /\.apk$/i.test(a.name) && typeof a.browser_download_url === 'string' && a.browser_download_url.indexOf(own + 'download/') === 0) url = a.browser_download_url; });
        if (j.tag_name) { latest = { v: norm(j.tag_name), url: url, at: Date.now() }; try { localStorage.setItem(KEY, JSON.stringify(latest)); } catch (e) { /* 무시 */ } }
        done();
      })
      .catch(function () { failed = true; done(); });
  }
  /* 폰(앱)이 확인한 최신 버전을 알려줄 때 */
  function native(v) { if (v) { latest = { v: norm(v), url: (latest && latest.url) || ('https://github.com/' + C.repo + '/releases/latest'), at: Date.now() }; try { localStorage.setItem(KEY, JSON.stringify(latest)); } catch (e) { /* 무시 */ } paint(); } }

  window.AppInfo = { open: open, check: check, native: native, refresh: paint,
    backupDone: function (ok, why) { bkDone(!!ok, why); }, backupOpened: function (t) { bkOpened(t); } };
  paint();
  if (C.online && (!latest || Date.now() - (latest.at || 0) > 6 * 3600000)) setTimeout(function () { check(false); }, 1500);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && C.online && latest && Date.now() - (latest.at || 0) > 6 * 3600000) check(false); });
})();
</script><!--/APPINFO-->
</body></html>
